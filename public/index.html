<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Snake Arena — 45-Player Neon Snake Battle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%230b0e1a%22/><circle cx=%2250%22 cy=%2250%22 r=%2222%22 fill=%22%2339ff88%22/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>

<!-- ================= LOBBY SCREEN ================= -->
<section id="screen-lobby" class="screen active">
  <div class="lobby-wrap">
    <div class="brand">
      <h1 class="logo" data-text="SNAKE ARENA">SNAKE ARENA</h1>
      <p class="tagline">45 players. 80 seconds. One slippery scramble.</p>
    </div>

    <div class="lobby-grid">
      <div class="panel setup-panel">
        <label class="field">
          <span class="field-label">Your name</span>
          <input id="nameInput" maxlength="16" placeholder="e.g. Noodle King" autocomplete="off" />
        </label>

        <label class="field">
          <span class="field-label">Room code</span>
          <input id="roomInput" maxlength="12" placeholder="MAIN" autocomplete="off" style="text-transform:uppercase" />
        </label>

        <div class="field">
          <span class="field-label">Snake color</span>
          <div id="colorSwatches" class="swatches"></div>
        </div>

        <div class="field">
          <span class="field-label">Snake pattern</span>
          <div id="patternOptions" class="pattern-options"></div>
        </div>

        <div class="field">
          <span class="field-label">Preview</span>
          <canvas id="previewCanvas" width="260" height="70"></canvas>
        </div>

        <button id="joinBtn" class="btn btn-primary btn-lg">Join Arena</button>
        <p id="joinError" class="error-text"></p>
      </div>

      <div class="panel roster-panel">
        <div class="roster-head">
          <h2>Lobby <span id="roomLabel">— MAIN</span></h2>
          <span id="playerCount" class="pill">0 / 45</span>
        </div>
        <ul id="rosterList" class="roster-list"></ul>
        <div id="hostControls" class="host-controls hidden">
          <button id="startBtn" class="btn btn-accent btn-lg">Start Game — 80s Round</button>
        </div>
        <p id="waitMsg" class="wait-msg hidden">Waiting for the host to start the round…</p>
        <p id="inviteHint" class="invite-hint"></p>
      </div>
    </div>
  </div>
</section>

<!-- ================= COUNTDOWN OVERLAY ================= -->
<div id="countdownOverlay" class="countdown-overlay hidden">
  <div id="countdownNum" class="countdown-num">3</div>
</div>

<!-- ================= GAME SCREEN ================= -->
<section id="screen-game" class="screen">
  <div class="hud-top">
    <div class="hud-block">
      <span class="hud-label">Time</span>
      <span id="hudTimer" class="hud-value mono">80.0</span>
    </div>
    <div class="hud-block">
      <span class="hud-label">Score</span>
      <span id="hudScore" class="hud-value mono">0</span>
    </div>
    <div id="hudLeaderboard" class="hud-leaderboard"></div>
    <button id="muteBtn" class="btn btn-icon" title="Toggle sound">🔊</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div class="hud-bottom">
    <div class="boost-bar-wrap">
      <span class="hud-label">Boost (hold click)</span>
      <div class="boost-bar"><div id="boostFill" class="boost-fill"></div></div>
    </div>
  </div>
</section>

<!-- ================= RESULTS SCREEN ================= -->
<section id="screen-results" class="screen">
  <div class="results-wrap">
    <h1 class="logo small" data-text="ROUND RESULTS">ROUND RESULTS</h1>
    <div id="podium" class="podium"></div>
    <ol id="fullLeaderboard" class="full-leaderboard"></ol>
    <div id="resultsHostControls" class="hidden">
      <button id="playAgainBtn" class="btn btn-primary btn-lg">Back to Lobby</button>
    </div>
    <p id="resultsWaitMsg" class="wait-msg hidden">Waiting for the host to return to the lobby…</p>
  </div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
